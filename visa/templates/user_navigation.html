<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<title></title>
    {% load static %}
<style>
  *{
    margin: 0px;
    list-style: none;
    padding: 0px;
    font-family:copperplate gothic;
  }
  .navigation-a{
    text-decoration: none;
    color: white;
    text-align: center;
    padding: 5px 20px;
    font-weight: bold;
    font-size: 22px;
    transition: all .5s;
  }
  .navigation-a:hover{
    color: black;
    background: gray;
    color: black;
    border-radius: 10px;
  }

  .logoi{
    padding-left: 25px;
    font-weight: bold;
    font-size: 30px;
  }
  .logoii{
    padding-left: 30px;
    font-size: 30px;
  }
  .menulogo{
    text-align: center;
    padding-right: 40px;
    font-weight: bold;
    font-size: 30px;
    transition: all .3s;
  }
  .menulogo:hover{
    font-weight: bold;
    border-radius: 10px;
  }
  .dropitem{
    color: black;
  }
  .dropdown-item{
    font-weight: bold;
  }
  .dropdown-menu{
    background: #DCD8FF;
    padding: 0px;
    width: 100%;
  }
</style>
</head>
<body>
<div class="row text-warning" style="background: pink;">
    <div class="col-3 d-none d-md-block logoi">
      <img src="{% static 'images/8.png' %}" height="30" width="100"> <a href="{% url 'edit_profile' %}"><i class="fa-solid fa-user-pen" style="color: #000000;"></i></a>
    </div>
    <div class="col-md-4 d-block d-md-none">
      <div class="row">
        <div class="col-3 logoii">
            <img src="{% static 'images/8.png' %}" height="30" width="100"> <a href="{% url 'edit_profile' %}"><i class="fa-solid fa-user-pen" style="color: #000000;"></i></a>
        </div>
        <div class="col-9 text-end menulogo">
          <a type="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa-solid fa-bars menulogo"></i></a>
          <ul class="dropdown-menu">
                <li><a href="{% url 'user_home' %}" class="dropdown-item ">Home</a></li>
                <li><a href="{% url 'apply' %}" class="dropdown-item ">Apply</a></li>
                <li><a href="{% url 'my_visa' %}" class="dropdown-item ">My Visa</a></li>
                <li><a href="{% url 'feedback' %}" class="dropdown-item ">Feedback</a></li>
                <li><a href="{% url 'logout' %}" class="dropdown-item ">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="col-9 d-none d-md-block">
      <ul class="list-group list-group-horizontal justify-content-end" style="margin-top: 7px;">
        <li class="menui"><a class="navigation-a" href="{% url 'user_home' %}">Home</a></li>
        <li class="menui"><a class="navigation-a" href="{% url 'apply' %}">Apply</a></li>
        <li class="menui"><a class="navigation-a" href="{% url 'my_visa' %}">My Visa</a></li>
        <li class="menui"><a class="navigation-a" href="{% url 'feedback' %}">Feedback</a></li>
        <li class="menui"><a class="navigation-a" href="{% url 'logout' %}">Logout</a></li>
      </ul>
    </div>
</div>
</body>
</html>
