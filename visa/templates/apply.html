{% include 'user_navigation.html' %}

{% load static %}


<script>

	function fun(){
    var name=document.getElementById("val").value;
    document.getElementById('name').innerHTML = name;
    }

    function validpayment(){
            let con = document.getElementById('contact').value;
            if(con.length!=10){
                alert("Contact Number Must be 10 digit");
                return false;
            }
        }

</script>

<marquee behavior="alternate" style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
    Apply For Visa
</marquee>
<hr>
<div class="row justify-content-center">
    <div class="col-11 col-md-7" style="background:lightgray;border-radius:10px;padding:5px 13vw">
        <form class="container mt-3" onsubmit="return checkpass();" name="signup" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>First Name</label>
            <input type="text" class="form-control" name="fname" placeholder="Enter First Name" value="{{user.first_name}}" required>
        </div>

        <div class="form-group col-md-12" >
            <label>Last Name</label>
            <input type="text" class="form-control" name="lname" placeholder="Enter Last Name" value="{{user.last_name}}">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>Email ID:</label>
            <input type="text" class="form-control" name="email" placeholder="Enter Email Address" value="{{user.username}}" readonly>
        </div>
        <div class="form-group col-md-12" >
            <label>Contact Number:</label>
            <input type="number" id="contact" class="form-control" name="contact" placeholder="Enter Phone Number" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>Select E-Visa Type:</label>
            <select name="ptype" class="form-control" required>
                <option value="" disabled selected style="display:none;">E-Visa Type</option>
                <option value="Tourist">Tourist</option>
                <option value="Work">For Work</option>
            </select>
        </div>
        <div class="form-group col-md-12" >
            <label>Application Request Date:</label>
            <input type="text" value="{{time}}" class="form-control" name="rdate" readonly>
        </div>
        <div class="form-group col-md-12" >
            <label>Country:</label>
            <input type="text" class="form-control" name="country" placeholder="Enter Country Name for Visa" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>Select Government ID:</label>
            <select name="gid" id="val" class="form-control" onchange="fun()" required>
                <option value="" disabled selected style="display:none;">Select ID</option>
                <option value="Aadhar">Aadhar Card</option>
                <option value="PanCard">Pan Card</option>
                <option value="DL">Driving Licence(DL) </option>
            </select>
        </div>

        <div class="form-group col-md-12" >
            <label>Enter <span id="name"></span> Number:</label>
            <input type="text" class="form-control" name="gidn" placeholder="Enter ID Proof Number" required>
        </div>

    </div>

    <div class="form-row">
        <div class="form-group col-md-12" >
            <label>Total Days</label>
            <select name="weight" id="" class="form-control" required>
                <option value="" selected disabled style="display:none;">E-Visa not valid for more than 2-year</option>
                <option value="1 Week">1 Week</option>
                <option value="1 Month">1 Month</option>
                <option value="6 Month">6 Month</option>
                <option value="1 Year">1 Year</option>
                <option value="2 Year">2 Year</option>
            </select>
        </div>

        <div class="form-group col-md-12" >
            <label>Enter Your Address:</label>
            <input type="text" class="form-control" name="address" placeholder="Sender Address" required>
        </div>
    </div>
    <center>
        <input type="submit" value="Submit" class="btn btn-primary my-3" style="width:200px" onclick="return validpayment()">
    </center>
</form>

    </div>
</div>

{% if error == "no" %}
<script>
    alert("E-Visa Request Send")
    window.location = ('{% url 'user_home' %}')
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Somthing Wrong, Try Again...")
</script>
{% endif %}


{% include 'footer.html' %}
