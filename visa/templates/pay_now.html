<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'user_navigation.html' %}
    <meta charset="UTF-8">
    <title>Title</title>
<style>
    .paynow{
    height:600px;
    margin-top:10px;
    background:lightgray;
    padding:30px 130px;
    border-radius:20px;
    }
    .ttl{
        margin-top:20px;
        font-size:20px;
    }
    .ttl1{
        margin-top:20px;
        font-size:20px;
        font-weight:bold;
        padding-left:20px;
    }
    .abcdef{
        width:100%;
    }
</style>
    <script>
        function validpayment(){
            let fn = document.getElementById('chname').value;
            if (!(fn.match(/^[A-Za-z\s]+$/))){
                  alert("Enter Valid First Name");
                  return false;
            }
            let con = document.getElementById('cardno').value;
            if(con.length!=16){
                alert("Enter 16 digit Card number");
                return false;
            }
            let cvv = document.getElementById('cvv').value;
            if(cvv.length!=3){
                alert("Enter 3 digit Valid CVV number");
                return false;
            }

        }
    </script>
</head>
<body>
</div>
<form method="post">
    {% csrf_token %}
    <div class="container-fluid">
        <div class="row justify-content-center abcdef" style="margin:0px;">
            <div class="col-7 paynow">
                <h1 align="center">Pay By Card</h1>
                <label for="">Card Holder Name</label>
                <input type="text" class="form-control" id="chname" name="name" placeholder="Enter Full Name" required>
                <label for="">Card Number</label>
                <input type="number" class="form-control" name="cardno" id="cardno" placeholder="Enter Card Number" required>
                <label for="">CVV</label>
                <input type="number" class="form-control" id="cvv" name="cvv" placeholder="Enter CVV Number" required>
                <label for="">Expiry date</label>
                <input type="date" class="form-control" name="exp_date" placeholder="Enter Expiry Date" required>
                <label for="" class="ttl">Total Amount :</label><label for="" class="ttl1">Rs. 10,000/-</label><br>
                <label for="" class="ttl">User Name :</label><label for="" class="ttl1">{{data.first_name}} {{data.last_name}}</label><br>
                <label for="" class="ttl">Email :</label><label for="" class="ttl1">{{data.email}} </label><br><br>
                <center>
                    <input type="submit" class="btn btn-success btn-lg" onclick="return validpayment()" value="Pay Now">
                    <a href="{% url 'my_visa' %}" class="btn btn-danger btn-lg">Cancel Payment</a>
                </center>
            </div>
        </div>
    </div>
</form>
</body>
</html>

{% if error == "no" %}
<script>
    alert("Payment Successful")
    window.location = ('{% url 'user_home' %}')
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong, Try Again")
</script>
{% endif %}
