
{% include 'navigation.html' %}

<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
     Login Page
</marquee>
<style>
    .login-base{
        background:rgba(211,211,211,.8);
        border-radius:10px;
    }
    body{
        background-image: url(https://www.corporatetraveller.co.za/sites/default/files/2018-02/airfares-101_0.jpg);
        background-size: 100% 100%;
    }
</style>
<hr>

<div class="row justify-content-center">
    <div class="col-10 col-md-5 login-base">
        <form class="container mt-4" method="post" style="margin-bottom:60px;">
            {% csrf_token %}
            <label><b>Username:</b></label>
            <input type="text" class="form-control" name="uname" placeholder="Enter Username" required>
            <label><b>Password:</b></label>
            <input type="password" class="form-control" name="pwd" placeholder="Enter Password" required>
        <center>
            <input type="submit" value="Login" class="btn btn-primary mt-4" style="margin-top:2%; color:darkcyan; background-color:black;width:200px;height:50px; font-size:25px;font-weight:bold;">
        </center>
        </form>
    </div>
</div>


{% if error == "no" %}
<script>
    alert("Login Successfully")
    window.location = ("{% url 'admin_home' %}")
</script>
{% endif %}

{% if error == "not" %}
<script>
    window.location = ("{% url 'user_home' %}")
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Invalid Login Details, Try Agail.....")
    window.location = ("{% url 'login' %}")
</script>
{% endif %}


{% include 'footer.html' %}
